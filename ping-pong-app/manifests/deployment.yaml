apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-app
  template:
    metadata:
      labels:
        app: ping-pong-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: log-claim
      containers:
        - name: ping-pong-app
          image: ping-pong-app:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-image
              mountPath: "/share/"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
          - name: PORT
            value: "3001"
          - name: LOG_PATH
            value: "/share/log.txt"