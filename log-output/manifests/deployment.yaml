apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-app
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-app
  template:
    metadata:
      labels:
        app: logger-app
    spec:
      containers:
        - name: logger-server
          image: logger-server:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: PORT
              value: "3000"
            - name: PONG_PATH
              value: "/pings"
            - name: "BASE_URL"
              value: "http://ping-pong-app-svc"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

