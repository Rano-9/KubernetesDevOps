apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-app
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-app
  template:
    metadata:
      labels:
        app: logger-app
    spec:
      containers:
        - name: logger-server
          image: logger-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: "/etc/config/information.txt"
            
          envFrom:
            - configMapRef:
                name: log-configmap
          volumeMounts:
            - name: config
              mountPath: "/etc/config"
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
      - name: config
        configMap:
          name: log-configmap 
