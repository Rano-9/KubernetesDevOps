apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-app
  template:
    metadata:
      labels:
        app: logger-app
    spec:
      volumes:
        - name: shared-image
          emptyDir: {}

      containers:
        - name: logger-server
          image: logger-server:latest
          imagePullPolicy: IfNotPresent
          
          env:
            - name: PORT
              value: "3000"  
            - name: LOG_PATH
              value: "/share/log.txt"

          volumeMounts:
            - name: shared-image
              mountPath: "/share/"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

        - name: logger-timestamp
          image: logger-timestamp:latest
          imagePullPolicy: IfNotPresent
          
          env: 
            - name: LOG_PATH
              value: "/share/log.txt"
          
          volumeMounts:
            - name: shared-image
              mountPath: "/share/"
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"