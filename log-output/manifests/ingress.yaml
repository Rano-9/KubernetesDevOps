apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logger-app-ingress
spec:
  rules:
  - http:
      paths:
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: ping-pong-app-svc
            port:
              number: 1235
      - path: /
        pathType: Exact
        backend:
          service:
            name: logger-app-svc
            port:
              number: 1234