apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # set to actual UID of appuser in image
        runAsGroup: 1001 # set to actual GID of appgroup in image
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"

      containers:
        - name: todo-frontend
          image: todo-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
